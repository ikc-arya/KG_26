<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aninext</title>
<meta name="description" content="Anime recommendations from watch history (LightGCN, MF, DistMult, TransE, popularity) tuned by your stated preferences (knowledge graph). All scoring runs in your browser.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="sharingan.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #07030a; /* near the image's black, so its edges disappear */
    --red: #e3122d;
    --pink: #fc1f91;
    --pink-glow: rgba(252, 31, 145, .3);
    --glass: rgba(14, 7, 18, .55);
    --field: rgba(6, 3, 10, .5);
    --surface-2: rgba(48, 26, 56, .7);
    --border: rgba(255, 150, 215, .14);
    --text: #f1ecf2;
    --muted: #a99fb3;
    --faint: #7d7388;
    --hi: #f7f5f2;
    --hi-soft: rgba(255, 255, 255, .08);
    --accent: #ff2d6f; /* the red/pink blend */
    --avoid: #8a7f95;
    --avoid-soft: rgba(138, 127, 149, .1);
    --radius: 12px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  button, input { font: inherit; color: inherit; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 40px 16px 56px; }

  /* background: the image (bg.jpg) on a fixed layer, moved slower than the page on scroll;
     pink/black gradients underneath are the fallback when no image is present */
  .bg {
    position: fixed; inset: 0; z-index: -1; overflow: hidden;
    background:
      radial-gradient(40% 45% at 82% 62%, rgba(227, 18, 45, .22), transparent 72%),
      radial-gradient(45% 40% at 10% 8%, rgba(252, 31, 145, .12), transparent 70%),
      var(--bg);
  }
  /* image pinned bottom-right (black background, so it melts into the page); soft masks on its
     left and top edges so there is no line. It starts 15vh below the fold: the parallax room */
  .bg-img {
    position: absolute; right: 0; bottom: -15vh; height: 95vh; aspect-ratio: 1630 / 2880;
    background: url("bg.jpg") right bottom / cover no-repeat; will-change: transform;
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 35%),
                        linear-gradient(180deg, transparent 0%, #000 22%);
    -webkit-mask-composite: source-in;
    mask-image: linear-gradient(90deg, transparent 0%, #000 35%),
                linear-gradient(180deg, transparent 0%, #000 22%);
    mask-composite: intersect;
  }
  /* frosted glass panels; the edge glows pink and fades into a black shadow */
  .glass {
    background: var(--glass);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    backdrop-filter: blur(18px) saturate(150%);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05), 0 0 38px -6px var(--pink-glow), 0 26px 70px rgba(0, 0, 0, .55);
  }
  header, .summary, footer { text-shadow: 0 2px 18px rgba(0, 0, 0, .7); }

  header { margin-bottom: 24px; }
  h1 { margin: 0; font-size: 34px; letter-spacing: -.03em; font-weight: 700; }
  h1 span {
    background: linear-gradient(90deg, var(--red), var(--pink)); -webkit-background-clip: text; background-clip: text;
    color: transparent; text-shadow: none; filter: drop-shadow(0 2px 14px rgba(255, 45, 111, .35));
  }
  .eye { display: block; width: 76px; height: 76px; margin: -8px 0 4px -8px; } /* the SVG carries its own glow margin */
  .tagline { margin: 8px 0 0; font-size: 20px; font-weight: 500; letter-spacing: -.01em; color: var(--hi); }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; align-items: center; }
  .examples small { color: var(--faint); margin-right: 2px; }
  .ex {
    background: none; border: 1px dashed var(--border); color: var(--muted);
    border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 13px;
  }
  .ex:hover { color: var(--text); border-color: var(--muted); }

  .card { padding: 20px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin: 18px 0 8px; }
  .label:first-child { margin-top: 0; }

  .seg { display: inline-flex; background: var(--field); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
  .seg button { background: none; border: 0; padding: 6px 14px; border-radius: 7px; color: var(--muted); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--text); }

  .combo { position: relative; flex: 1 1 260px; min-width: 0; }
  .combo input {
    width: 100%; background: var(--field); border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 12px; outline: none;
  }
  .combo input:focus { border-color: var(--accent); }
  .combo ul {
    position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: 4px;
    list-style: none; background: rgba(26, 13, 32, .94); border: 1px solid var(--border); border-radius: 10px;
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    max-height: 280px; overflow-y: auto; box-shadow: 0 12px 32px rgba(0, 0, 0, .45);
  }
  .combo li { display: flex; justify-content: space-between; gap: 12px; padding: 7px 10px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
  .combo li span:first-child { overflow: hidden; text-overflow: ellipsis; }
  .combo li .kind { flex: none; color: var(--faint); font-size: 12px; }
  .combo li[aria-selected="true"] { background: var(--hi-soft); color: var(--hi); }
  .btn {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 14px; cursor: pointer; color: var(--muted);
  }
  .btn:hover { color: var(--text); }
  .hint { color: var(--faint); font-size: 13px; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 999px; padding: 4px 6px 4px 12px; font-size: 13px;
  }
  .chip button { background: none; border: 0; color: var(--faint); cursor: pointer; padding: 0 4px; font-size: 15px; line-height: 1; }
  .chip button:hover { color: var(--text); }

  /* preference wheels: rows snap into the centre band; the row above and below stay visible, blurred */
  .wheels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .wheel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .wheel-head span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  .wheel-head small { color: var(--faint); font-size: 12px; white-space: nowrap; }
  /* a soft-edged well; the centre band is a raised rounded box floating above it, behind the list */
  .wheel-frame {
    --row: 38px; /* keep in sync with ROW in the script */
    position: relative; border-radius: 14px; background: var(--field);
    box-shadow: 0 0 14px 6px var(--field); /* same colour as the fill: a soft, blurred edge, no line */
  }
  .wheel-frame::before {
    content: ""; position: absolute; left: 5px; right: 5px; top: var(--row); height: var(--row); pointer-events: none;
    border-radius: 10px; background: rgba(255, 255, 255, .075); border: 1px solid rgba(255, 150, 215, .22);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08), 0 8px 22px rgba(0, 0, 0, .5), 0 0 20px -6px var(--pink-glow);
  }
  .wheel {
    position: relative; z-index: 1; height: calc(var(--row) * 3); overflow-y: auto; outline: none; border-radius: 12px;
    scroll-snap-type: y mandatory; overscroll-behavior: contain; scrollbar-width: none;
    -webkit-mask-image: linear-gradient(180deg, rgba(0, 0, 0, .55), #000 34%, #000 66%, rgba(0, 0, 0, .55));
    mask-image: linear-gradient(180deg, rgba(0, 0, 0, .55), #000 34%, #000 66%, rgba(0, 0, 0, .55));
  }
  .wheel::-webkit-scrollbar { display: none; }
  .wheel:focus-visible { box-shadow: 0 0 0 1px var(--accent); }
  .wheel ul { list-style: none; margin: 0; padding: var(--row) 0; }
  .wheel li {
    height: var(--row); display: flex; align-items: center; justify-content: center; gap: 7px; padding: 0 10px;
    scroll-snap-align: center; cursor: pointer; user-select: none; -webkit-user-select: none;
    color: var(--muted); white-space: nowrap; filter: blur(0.9px); opacity: .62;
    transition: filter .15s, opacity .15s, color .15s;
  }
  .wheel li span { overflow: hidden; text-overflow: ellipsis; }
  /* horizontal variant (model): same well + raised band, items side by side, 3 in view */
  .wheel-frame.h { --item: 160px; /* keep in sync with ITEM in the script */ max-width: calc(var(--item) * 3); }
  .wheel-frame.h::before { top: 0; left: calc(50% - var(--item) / 2 + 4px); right: auto; width: calc(var(--item) - 8px); }
  .wheel.h {
    height: var(--row); overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory;
    -webkit-mask-image: linear-gradient(90deg, rgba(0, 0, 0, .55), #000 34%, #000 66%, rgba(0, 0, 0, .55));
    mask-image: linear-gradient(90deg, rgba(0, 0, 0, .55), #000 34%, #000 66%, rgba(0, 0, 0, .55));
  }
  .wheel.h ul { display: flex; width: max-content; padding: 0 calc(50% - var(--item) / 2); }
  .wheel.h li { flex: 0 0 var(--item); }
  .wheel li.c { filter: none; opacity: 1; color: var(--text); }
  .wheel.h li.c { color: var(--hi); font-weight: 500; }
  .wheel li[data-state="prefer"] { color: var(--hi); font-weight: 500; }
  .wheel li[data-state="prefer"]::before, .chip.p::before {
    content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
  }
  .wheel li[data-state="avoid"] { color: var(--avoid); text-decoration: line-through; }
  .picked { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .picked:empty { display: none; }
  .chip.a { color: var(--avoid); border-style: dashed; text-decoration: line-through; }
  .controls { display: grid; grid-template-columns: 1fr auto; gap: 16px 28px; align-items: end; margin-top: 4px; }
  .slider { display: flex; align-items: center; gap: 12px; }
  .slider input {
    flex: 1; height: 4px; margin: 0; border: 0; border-radius: 999px; outline: none; cursor: pointer;
    -webkit-appearance: none; appearance: none;
    background: linear-gradient(90deg, var(--accent) var(--p, 33%), rgba(255, 255, 255, .12) var(--p, 33%));
  }
  .slider input::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border: 0; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 4px rgba(255, 45, 111, .18), 0 0 14px rgba(255, 45, 111, .6);
  }
  .slider input::-moz-range-thumb {
    width: 16px; height: 16px; border: 0; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 4px rgba(255, 45, 111, .18), 0 0 14px rgba(255, 45, 111, .6);
  }
  .slider input::-moz-range-track { background: transparent; border: 0; }
  .slider input:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px rgba(255, 255, 255, .35), 0 0 14px rgba(255, 45, 111, .6); }
  .slider output { min-width: 3ch; font-variant-numeric: tabular-nums; color: var(--text); }

  .summary { margin: 28px 0 12px; color: var(--muted); font-size: 14px; min-height: 21px; }
  .summary b { color: var(--text); font-weight: 600; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .col { padding: 20px; min-width: 0; }
  .col h2 { margin: 0 0 2px; font-size: 16px; font-weight: 600; }
  .col .cap { margin: 0 0 12px; color: var(--faint); font-size: 13px; }
  ol { list-style: none; margin: 0; padding: 0; counter-reset: r; }
  ol li { counter-increment: r; display: grid; grid-template-columns: 26px 1fr; gap: 2px 8px; padding: 10px 0; border-top: 1px solid var(--border); }
  ol li:first-child { border-top: 0; }
  ol li::before { content: counter(r); color: var(--faint); font-variant-numeric: tabular-nums; text-align: right; padding-top: 1px; }
  .t { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; min-width: 0; }
  .t a { text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t a:hover { color: var(--accent); }
  .badge { flex: none; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .badge.moved { color: var(--accent); }
  .mini { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px; }
  .mini span { font-size: 11.5px; color: var(--faint); border: 1px solid var(--border); border-radius: 999px; padding: 0 8px; }
  .mini span.p { color: var(--hi); border-color: rgba(255, 255, 255, .45); }
  .mini span.a { color: var(--avoid); border-style: dashed; border-color: var(--avoid); text-decoration: line-through; }
  .empty { color: var(--faint); padding: 24px 0; }

  footer { margin-top: 48px; color: var(--faint); font-size: 13px; line-height: 1.7; }
  footer a { color: var(--muted); }

  @media (max-width: 720px) {
    .wrap { padding-top: 28px; }
    .cols, .controls { grid-template-columns: 1fr; }
    .wheels { grid-template-columns: 1fr 1fr; gap: 16px 12px; }
    .wheels > :last-child { grid-column: span 2; }
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="bg-img" id="bgImg"></div></div>
<div class="wrap">
  <header>
    <img class="eye" src="sharingan.svg" alt="">
    <h1>Ani<span>next</span></h1>
    <p class="tagline">Let's find your matches 😉 ...</p>
    <div class="examples" id="examples"><small>Try</small></div>
  </header>

  <section class="card glass" id="panel" aria-busy="true">
    <div class="label">Start from</div>
    <div class="row">
      <div class="combo" id="whoCombo"></div>
      <button type="button" class="btn" id="randomUser">Random user</button>
    </div>
    <div class="chips" id="liked"></div>

    <div class="label">Model</div>
    <div id="modelWheel"></div>
    <p class="hint" id="hint"></p>

    <div class="label">Preferences</div>
    <div class="wheels" id="wheels"></div>
    <div class="picked" id="picked"></div>

    <div class="controls">
      <div>
        <div class="label">Boost per preferred tag</div>
        <div class="slider">
          <input type="range" id="boost" min="0" max="3" step="0.25" value="1" aria-label="Boost">
          <output id="boostOut">1.0</output>
        </div>
      </div>
      <div>
        <div class="label">Show</div>
        <div class="seg" role="group" aria-label="Number of results" id="kSeg">
          <button type="button" data-k="5" aria-pressed="false">5</button>
          <button type="button" data-k="10" aria-pressed="true">10</button>
          <button type="button" data-k="20" aria-pressed="false">20</button>
        </div>
      </div>
    </div>
  </section>

  <p class="summary" id="summary">Loading model…</p>
  <div class="cols">
    <section class="col glass">
      <h2>From watch history</h2>
      <p class="cap" id="baseCap"></p>
      <ol id="base"></ol>
    </section>
    <section class="col glass">
      <h2>Tuned to you</h2>
      <p class="cap">+ preferred tags, − avoided tags (KG)</p>
      <ol id="tuned"></ol>
    </section>
  </div>

  <footer id="footer"></footer>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...kids) => {
  const e = Object.assign(document.createElement(tag), props);
  e.append(...kids);
  return e;
};

const S = { mode: "user", user: "user_66835", liked: [], tag: new Map(), boost: 1, k: 10, model: null };
let D; // data

// ---------- data
async function load() {
  const get = (f) => fetch("data/" + f);
  const [anime, users, meta, K, pop] = await Promise.all([
    get("anime.json").then((r) => r.json()),
    get("users.json").then((r) => r.json()),
    get("meta.json").then((r) => r.json()),
    get("known.bin").then((r) => r.arrayBuffer()),
    get("popularity/pop.bin").then((r) => r.arrayBuffer()), // also ranks the title search
  ]);
  const uIdx = new Map(users.ids.map((u, i) => [u, i]));
  const tIdx = new Map(anime.anime.map((a, i) => [a.title.toLowerCase(), i]));
  const tagSets = anime.anime.map((a) => new Set(a.tags));
  const models = new Map(meta.models.map((m) => [m.key, m]));
  return { anime: anime.anime, vocab: anime.tags, users, meta, models, uIdx, tIdx, tagSets,
           K: new Uint16Array(K), pop: new Float32Array(pop), cache: new Map(), pending: new Map() };
}

// one model's vectors, fetched the first time it is picked
function loadModel(key) {
  if (!D.pending.has(key)) {
    const m = D.models.get(key);
    const bin = (f) => fetch(`data/${key}/${f}`).then((r) => r.arrayBuffer()).then((b) => new Float32Array(b));
    const p = m.kind === "pop"
      ? bin("pop.bin").then((s) => ({ kind: m.kind, s }))
      : Promise.all([bin("anime.bin"), bin("user.bin")]).then(([A, Q]) => ({ kind: m.kind, d: m.dim, A, Q }));
    D.pending.set(key, p.then((v) => D.cache.set(key, v)));
  }
  return D.pending.get(key);
}

// ---------- the model: scores per kind (see export_web.py), then the recommend.rerank formula
function recommend(M) {
  const { anime, tagSets } = D;
  const n = anime.length;
  const known = new Uint8Array(n);
  const { A, d } = M;
  const q = new Float64Array(d || 0); // the user's query vector
  if (S.mode === "user") {
    const ui = D.uIdx.get(S.user);
    if (ui === undefined) return null;
    const { offsets } = D.users;
    for (let j = offsets[ui]; j < offsets[ui + 1]; j++) known[D.K[j]] = 1;
    for (let c = 0; c < d; c++) q[c] = M.Q[ui * d + c];
  } else {
    if (!S.liked.length) return null;
    for (const i of S.liked) {
      known[i] = 1;
      for (let c = 0; c < d; c++) q[c] += A[i * d + c] / S.liked.length;
    }
  }
  // ML: dot | -distance | popularity count; known masked, z-score over the rest (population std)
  const s = new Float64Array(n);
  let sum = 0, sq = 0, m = 0;
  for (let i = 0; i < n; i++) {
    let x = 0;
    if (M.kind === "pop") x = M.s[i];
    else if (M.kind === "dot") for (let c = 0; c < d; c++) x += A[i * d + c] * q[c];
    else { for (let c = 0; c < d; c++) x += (A[i * d + c] - q[c]) ** 2; x = -Math.sqrt(x); }
    s[i] = x;
    if (!known[i]) { sum += x; m++; }
  }
  const mean = sum / m;
  for (let i = 0; i < n; i++) if (!known[i]) sq += (s[i] - mean) ** 2;
  const std = Math.sqrt(sq / m);
  const prefer = [...S.tag].filter(([, v]) => v === "prefer").map(([t]) => t);
  const avoid = [...S.tag].filter(([, v]) => v === "avoid").map(([t]) => t);
  const z = new Float64Array(n), tuned = new Float64Array(n), pref = new Uint8Array(n), avo = new Uint8Array(n);
  for (let i = 0; i < n; i++) {
    for (const t of prefer) if (tagSets[i].has(t)) pref[i]++;
    for (const t of avoid) if (tagSets[i].has(t)) avo[i] = 1;
    z[i] = known[i] ? -Infinity : (s[i] - mean) / std;
    tuned[i] = avo[i] ? -Infinity : z[i] + S.boost * pref[i];
  }
  const order = (x) => Array.from(x.keys()).filter((i) => x[i] > -Infinity).sort((a, b) => x[b] - x[a]);
  const zOrder = order(z);
  const zRank = new Map(zOrder.map((i, r) => [i, r + 1]));
  return { base: zOrder.slice(0, S.k), tuned: order(tuned).slice(0, S.k), zRank, pref, avo,
           prefer: new Set(prefer), avoid: new Set(avoid), nKnown: known.reduce((a, b) => a + b, 0) };
}

// ---------- rendering
function item(i, R, withRank, pos) {
  const a = D.anime[i];
  const link = el("a", { href: `https://myanimelist.net/anime/${a.id}`, target: "_blank", rel: "noopener", textContent: a.title, title: a.title });
  const top = el("div", { className: "t" }, link);
  if (withRank) {
    const r = R.zRank.get(i);
    top.append(el("span", { className: "badge" + (r > pos ? " moved" : ""), textContent: r === pos ? "same" : `ML #${r}`,
                            title: "Rank in the ML-only list" }));
  }
  const mini = el("div", { className: "mini" });
  const tags = [...a.tags].sort((x, y) => (R.prefer.has(y) - R.prefer.has(x)) || (R.avoid.has(y) - R.avoid.has(x)));
  for (const t of tags) {
    mini.append(el("span", { className: R.prefer.has(t) ? "p" : R.avoid.has(t) ? "a" : "", textContent: D.vocab[t].label }));
  }
  return el("li", {}, top, mini);
}

function render() {
  saveHash();
  const model = D.models.get(S.model);
  $("baseCap").textContent = `ML only: ${model.label} scores`;
  const M = D.cache.get(S.model);
  if (!M) {
    $("summary").textContent = `Loading ${model.label}…`;
    loadModel(S.model).then(render);
    return;
  }
  const R = recommend(M);
  const base = $("base"), tuned = $("tuned");
  if (!R) {
    const msg = "Search a few anime you liked to get started.";
    base.replaceChildren(el("p", { className: "empty", textContent: msg }));
    tuned.replaceChildren();
    $("summary").textContent = "";
    $("hint").textContent = model.desc;
    return;
  }
  base.replaceChildren(...R.base.map((i, p) => item(i, R, false, p + 1)));
  tuned.replaceChildren(...R.tuned.map((i, p) => item(i, R, true, p + 1)));
  const n = S.mode === "user" ? `${S.user}'s ${R.nKnown} watched anime` : `the ${S.liked.length} anime you picked`;
  $("hint").textContent = `${model.desc} · ` + (model.kind === "pop" ? `ignores ${n}, only hides them` : `based on ${n}, never shown again`);
  const share = (list, m) => Math.round(100 * list.filter((i) => m[i]).length / list.length) + "%";
  const parts = [];
  if (R.prefer.size) parts.push(`Preferred tags in the top ${S.k}: <b>${share(R.base, R.pref)}</b> → <b>${share(R.tuned, R.pref)}</b>`);
  if (R.avoid.size) parts.push(`Avoided: <b>${share(R.base, R.avo)}</b> → <b>${share(R.tuned, R.avo)}</b>`);
  $("summary").innerHTML = parts.length ? parts.join(" · ") : "Pick some tags to tune the list. With no preferences both columns are the same.";
}

// ---------- combobox (users or titles)
function combo(host, { placeholder, source, onPick }) {
  const input = el("input", { type: "text", placeholder, autocomplete: "off", spellcheck: false });
  input.setAttribute("aria-label", placeholder);
  const list = el("ul", { hidden: true, role: "listbox" });
  host.replaceChildren(input, list);
  let hits = [], sel = 0;
  const show = () => {
    list.replaceChildren(...hits.map((h, j) => {
      const li = el("li", { role: "option" }, el("span", { textContent: h.label }));
      if (h.kind) li.append(el("span", { className: "kind", textContent: h.kind }));
      li.setAttribute("aria-selected", j === sel);
      li.addEventListener("mousedown", (e) => { e.preventDefault(); pick(j); });
      return li;
    }));
    list.hidden = !hits.length;
  };
  const pick = (j) => { if (hits[j]) { onPick(hits[j], input); hits = []; show(); } };
  input.addEventListener("input", () => {
    const q = input.value.trim().toLowerCase();
    hits = q ? source(q) : [];
    sel = 0;
    show();
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      sel = (sel + (e.key === "ArrowDown" ? 1 : hits.length - 1)) % Math.max(hits.length, 1);
      show();
    } else if (e.key === "Enter") { e.preventDefault(); pick(sel); }
    else if (e.key === "Escape") { hits = []; show(); }
  });
  input.addEventListener("blur", () => { hits = []; show(); });
  return input;
}

// prefix matches before substring matches; within each, higher `rank` first (e.g. popularity)
function search(labels, q, limit = 8, rank = null) {
  const starts = [], has = [];
  for (let i = 0; i < labels.length; i++) {
    const l = labels[i].toLowerCase();
    if (l.startsWith(q)) starts.push(i);
    else if (l.includes(q)) has.push(i);
  }
  if (rank) for (const g of [starts, has]) g.sort((a, b) => rank[b] - rank[a]);
  return [...starts, ...has].slice(0, limit);
}

let whoInput;
// one search box: anime titles (-> "new user" who liked them) and user ids (-> that user's history)
function setupWho() {
  const titles = D.anime.map((a) => a.title);
  whoInput = combo($("whoCombo"), {
    placeholder: "Search an anime you liked, or a user id…",
    source: (q) => {
      const anime = search(titles, q, 7, D.pop).filter((i) => S.mode !== "new" || !S.liked.includes(i))
        .map((i) => ({ i, label: titles[i], kind: "anime" }));
      const users = /\d|^user/.test(q) ? search(D.users.ids, q, 3).map((i) => ({ i, label: D.users.ids[i], kind: "user" })) : [];
      return [...anime, ...users];
    },
    onPick: (h, input) => {
      if (h.kind === "user") { S.mode = "user"; S.user = h.label; }
      else {
        if (S.mode !== "new") { S.mode = "new"; S.liked = []; }
        S.liked.push(h.i);
      }
      input.value = "";
      renderLiked();
      render();
    },
  });
}

function renderLiked() {
  const chip = (text, onRemove) => {
    const x = el("button", { type: "button", textContent: "×", title: "Remove" });
    x.addEventListener("click", onRemove);
    return el("span", { className: "chip" }, text, x);
  };
  const clear = () => { S.mode = "new"; S.liked = []; renderLiked(); render(); };
  $("liked").replaceChildren(...(S.mode === "user"
    ? [chip(S.user, clear)]
    : S.liked.map((i) => chip(D.anime[i].title, () => { S.liked = S.liked.filter((j) => j !== i); renderLiked(); render(); }))));
}

// ---------- picker wheels
const ROW = 38;   // px per row, = --row in the CSS
const ITEM = 160; // px per item in a horizontal wheel, = --item in the CSS
const cycle = { "": "prefer", prefer: "avoid", avoid: "" };

// a snap-scrolling list. Default: vertical, scrolling browses and tapping a row toggles it
// (prefer -> avoid -> off). single: horizontal, the centred item is the value (the model).
function wheel(title, items, { state, onPick, count = () => "", single = false }) {
  const step = single ? ITEM : ROW;
  const ul = el("ul", { role: "listbox" });
  const box = el("div", { className: "wheel" + (single ? " h" : ""), tabIndex: 0 }, ul);
  box.setAttribute("aria-label", title);
  const small = el("small");
  const frame = el("div", { className: "wheel-frame" + (single ? " h" : "") }, box);
  const root = single ? frame
    : el("div", {}, el("div", { className: "wheel-head" }, el("span", { textContent: title }), small), frame);
  const lis = items.map((it, i) => {
    const li = el("li", { role: "option", title: it.label }, el("span", { textContent: it.label }));
    li.addEventListener("click", () => { center(i, true); onPick(it.key); refresh(); });
    ul.append(li);
    return li;
  });
  let cur = -1, settle = 0;
  const at = () => Math.max(0, Math.min(items.length - 1, Math.round((single ? box.scrollLeft : box.scrollTop) / step)));
  const mark = () => {
    const i = at();
    if (i === cur) return;
    lis[cur]?.classList.remove("c");
    lis[i].classList.add("c");
    cur = i;
  };
  box.addEventListener("scroll", () => {
    mark(); // cheap: only touches classes when the centred item changes
    if (single) { clearTimeout(settle); settle = setTimeout(() => onPick(items[at()].key), 140); } // pick where it stops
  }, { passive: true });
  const [back, fwd] = single ? ["ArrowLeft", "ArrowRight"] : ["ArrowUp", "ArrowDown"];
  box.addEventListener("keydown", (e) => {
    if (e.key === back || e.key === fwd) { e.preventDefault(); center(at() + (e.key === fwd ? 1 : -1), true); }
    else if (!single && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); onPick(items[at()].key); refresh(); }
  });
  function center(i, smooth) {
    i = Math.max(0, Math.min(items.length - 1, i));
    box.scrollTo({ [single ? "left" : "top"]: i * step, behavior: smooth ? "smooth" : "auto" });
    if (!smooth) mark();
  }
  function refresh() {
    lis.forEach((li, i) => { li.dataset.state = state(items[i].key); li.setAttribute("aria-selected", !!li.dataset.state); });
    small.textContent = count();
  }
  refresh();
  return { root, center, refresh, items };
}

let W = {}; // the wheels, by name
function renderModels() {
  const models = D.meta.models.map((m) => ({ key: m.key, label: m.label }));
  W.model = wheel("Model", models, {
    single: true,
    state: (k) => (k === S.model ? "on" : ""),
    onPick: (k) => { if (k !== S.model) { S.model = k; render(); } },
  });
  $("modelWheel").replaceChildren(W.model.root);
  W.model.center(models.findIndex((m) => m.key === S.model), false);
}

function renderWheels() {
  const tagWheel = (cls, title) => {
    const items = D.vocab.map((v, t) => ({ key: t, label: v.label, cls: v.class })).filter((x) => x.cls === cls);
    return wheel(title, items, {
      state: (t) => S.tag.get(t) || "",
      onPick: (t) => {
        const next = cycle[S.tag.get(t) || ""];
        next ? S.tag.set(t, next) : S.tag.delete(t);
        renderPicked();
        render();
      },
      count: () => { const n = items.filter((x) => S.tag.has(x.key)).length; return n ? `${n} picked` : ""; },
    });
  };
  W.Genre = tagWheel("Genre", "Genre");
  W.Demographic = tagWheel("Demographic", "Demographic");
  W.Theme = tagWheel("Theme", `Theme`);
  $("wheels").replaceChildren(W.Genre.root, W.Demographic.root, W.Theme.root);
  // start each wheel on its first picked tag
  for (const w of [W.Genre, W.Demographic, W.Theme]) w.center(Math.max(0, w.items.findIndex((x) => S.tag.has(x.key))), false);
  renderPicked();
}

// everything picked across the tag wheels, as removable chips (a wheel only shows 3 rows)
function renderPicked() {
  const chips = [...S.tag].sort((x, y) => (x[1] > y[1]) - (x[1] < y[1])).map(([t, st]) => {
    const x = el("button", { type: "button", textContent: "×", title: "Remove" });
    x.addEventListener("click", () => {
      S.tag.delete(t);
      W[D.vocab[t].class].refresh();
      renderPicked();
      render();
    });
    return el("span", { className: "chip " + (st === "prefer" ? "p" : "a") }, D.vocab[t].label, x);
  });
  $("picked").replaceChildren(...chips);
}

function showBoost() {
  const b = $("boost");
  b.value = S.boost;
  b.style.setProperty("--p", (100 * S.boost / Number(b.max)) + "%"); // filled part of the track
  $("boostOut").value = S.boost.toFixed(S.boost % 1 ? 2 : 1);
}

// ---------- shareable state in the URL hash
function saveHash() {
  const p = new URLSearchParams();
  if (S.mode === "user") p.set("user", S.user); else p.set("liked", S.liked.map((i) => D.anime[i].id).join(","));
  const pick = (v) => [...S.tag].filter(([, s]) => s === v).map(([t]) => D.vocab[t].label).join(",");
  if (pick("prefer")) p.set("prefer", pick("prefer"));
  if (pick("avoid")) p.set("avoid", pick("avoid"));
  if (S.boost !== 1) p.set("boost", S.boost);
  if (S.k !== 10) p.set("k", S.k);
  if (S.model !== D.meta.default) p.set("model", S.model);
  history.replaceState(null, "", "#" + p.toString());
}

function readHash(hash) {
  const p = new URLSearchParams(hash.replace(/^#/, ""));
  const byLabel = new Map(D.vocab.map((v, t) => [v.label.toLowerCase(), t]));
  const byId = new Map(D.anime.map((a, i) => [a.id, i]));
  S.tag = new Map();
  for (const [key, v] of [["prefer", "prefer"], ["avoid", "avoid"]]) {
    for (const l of (p.get(key) || "").split(",")) if (byLabel.has(l.trim().toLowerCase())) S.tag.set(byLabel.get(l.trim().toLowerCase()), v);
  }
  S.boost = Number(p.get("boost")) || (p.has("boost") ? 0 : 1);
  S.k = [5, 10, 20].includes(Number(p.get("k"))) ? Number(p.get("k")) : 10;
  S.model = D.models.has(p.get("model")) ? p.get("model") : D.meta.default;
  if (p.has("liked")) {
    S.liked = p.get("liked").split(",").map((id) => byId.get(id)).filter((i) => i !== undefined);
    S.mode = "new";
  } else {
    if (p.has("user") && D.uIdx.has(p.get("user"))) S.user = p.get("user");
    S.mode = "user";
  }
  showBoost();
  for (const b of $("kSeg").children) b.setAttribute("aria-pressed", Number(b.dataset.k) === S.k);
  renderModels();
  renderWheels();
  renderLiked();
  render();
}

// ---------- parallax background
(() => {
  const img = $("bgImg");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let queued = false;
  const move = () => {
    queued = false;
    const maxScroll = document.documentElement.scrollHeight - innerHeight;
    const room = img.offsetTop + img.offsetHeight - innerHeight; // px the layer can move up
    const f = maxScroll > 0 ? Math.min(0.25, room / maxScroll) : 0;
    img.style.transform = `translate3d(0, ${-scrollY * f}px, 0)`;
  };
  const queue = () => { if (!queued) { queued = true; requestAnimationFrame(move); } };
  addEventListener("scroll", queue, { passive: true });
  addEventListener("resize", queue);
})();

// ---------- wiring
const EXAMPLES = [
  ["Liked Cowboy Bebop, Samurai Champloo, Trigun · Sci-Fi", "#liked=1,205,6&prefer=Sci-Fi&boost=0.5"],
  ["A long-time user · Romance + Comedy, no Hentai", "#user=user_66835&prefer=Romance,Comedy&avoid=Hentai"],
];

load().then((data) => {
  D = data;
  for (const [text, hash] of EXAMPLES) {
    const b = el("button", { type: "button", className: "ex", textContent: text });
    b.addEventListener("click", () => readHash(hash));
    $("examples").append(b);
  }
  setupWho();
  $("randomUser").addEventListener("click", () => {
    S.mode = "user";
    S.user = D.users.ids[Math.floor(Math.random() * D.users.ids.length)];
    renderLiked();
    render();
  });
  $("boost").addEventListener("input", (e) => {
    S.boost = Number(e.target.value);
    showBoost();
    render();
  });
  for (const b of $("kSeg").children) {
    b.addEventListener("click", () => {
      S.k = Number(b.dataset.k);
      for (const o of $("kSeg").children) o.setAttribute("aria-pressed", o === b);
      render();
    });
  }
  const m = D.meta;
  $("footer").innerHTML =
    `Models trained on ${m.n_users.toLocaleString()} MyAnimeList users × ${m.n_anime.toLocaleString()} anime. ` +
    `Preferences come from the genre, theme and demographic edges of the knowledge graph. All scoring runs in your browser. ` +
    `<a href="https://github.com/ikc-arya/KG_26">Source on GitHub</a>`;
  $("panel").setAttribute("aria-busy", "false");
  readHash(location.hash || EXAMPLES[0][1]);
}).catch((err) => {
  $("summary").textContent = "Could not load the model data (" + err.message + "). Serve this folder over HTTP, e.g. python -m http.server -d docs.";
});
</script>
